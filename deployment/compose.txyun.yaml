name: ustb-seat-book
services:
  ustb-seat-book:
    image: ustb-seat-book:txyun-amd64-20261021a
    pull_policy: never
    platform: linux/amd64
    container_name: ustb-seat-book
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      - "0.0.0.0:18001:8000"
    volumes:
      - type: bind
        source: ./config.json
        target: /app/config.json
        bind:
          create_host_path: false
      - type: bind
        source: ./logs
        target: /app/logs
        bind:
          create_host_path: false
    mem_limit: 1536m
    memswap_limit: 2560m
    oom_score_adj: -500
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 2
    pids_limit: 512
    shm_size: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
